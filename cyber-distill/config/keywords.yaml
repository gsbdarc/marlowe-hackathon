# Stage 4 prefilter terms (runbook v2). Matching: case-insensitive, whole words; terms marked
# prefix match any word that starts with them; every other term also matches a plural (s/es).
# Words inside a phrase may be separated by spaces or hyphens ("denial-of-service").
# Change this file only with a run-log entry saying why.
core:
  - cyber          # prefix: cybersecurity, cyberattack, cyber-attack
  - hack           # prefix: hacker, hacking, hacked
  - ransomware
  - malware
  - phishing
  - unauthorized access
  - information security
  - data security
  - network security
  - security breach
  - security incident
  - data breach
  - intrusion
  - denial of service
  - threat actor
  - encryption
traps:
  - breach
  - virus
  - year 2000
  - y2k
  - computer systems
  - personal information
  - personally identifiable
  - system outage
  - network outage
prefix: [cyber, hack]
# Stage 6 incident enrichment cues (matched the same way, not prefix)
incident_cues:
  - we detected
  - we discovered
  - we became aware
  - unauthorized third party
  - forensic
random_sample:
  share: 0.01        # of paragraphs with no core or trap term
  seed: 20261106
